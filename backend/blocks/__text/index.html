<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Combined CSS styles */
        body, html {
            height: 100%;
            width: 100%;
            margin: 0;
            overflow: hidden;
        }
        
        .container {
            height: 100%;
            width: 100%;
            overflow: hidden;
        }

        #text-form, .image-container {
            height: 100%;
            width: 100%;
            overflow: hidden;
        }

        #colorPicker {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 20px;
            height: 20px;
            border: none;
        }

        input[type="color"]::-webkit-color-swatch {
            border: none;
            background-color: transparent;
        }

        .input {
            resize: vertical;
            background-color: transparent;
            border: none;
            font-family: 'Open Sans', sans-serif;
            font-size: 20px;
            width: 100%;
            height: 100%;
            resize: none;
        }

        .image-item {
            font-family: 'Open Sans', sans-serif;
            font-size: 20px;
            max-width: 100%;
            height: 100%;
            word-wrap: break-word;
        }
    </style>
    <title>Image Upload</title>
</head>
<body>
    <div id="container" class="container">
        <input type="color" id="colorPicker" name="colorPicker" value="#ffffff" />
        <form id="text-form">
            <label class="input-file">
                <textarea type="text" name="text" accept="text/*" class="input"  id="input" placeholder=""></textarea>
            </label>
        </form>
        <div id="image-container"></div>
    </div>
    <script>
        // Combined JavaScript code
        const id = "%%id%%";
        const name = "%%name%%", author = "%%author%%";

        document.addEventListener("DOMContentLoaded", () => {
            const allContainer = document.getElementById("container");
            const container = document.getElementById("image-container");
            const colorPicker = document.getElementById("colorPicker");
            const textForm = document.getElementById("text-form");

            async function updateData(text, colour) {
                try {
                    const response = await fetch("http://192.168.0.117:7000/upload_txt", {
                        method: "POST",
                        body: JSON.stringify({
                            id,
                            text,
                            colour,
                        }),
                        headers: {
                            "Content-Type": "application/json",
                        },
                    });
                    const data = await response.json();
                    addImageToContainer(data);
                } catch (error) {
                    console.error("Error sending data to the server:", error);
                }
            }

            function addImageToContainer(data) {
                container.innerHTML = '';
                const item = document.createElement("div");
                item.classList.add("image-item");
                item.textContent = data.text;
                textForm.querySelector('textarea[name="text"]').value = data.text;
                colorPicker.value = data.colour;
                container.appendChild(item);
                allContainer.style.backgroundColor = data.colour;
                const isLight = luminance(data.colour) > 0.5;
                item.style.color = isLight ? '#000000' : '#ffffff';
                document.getElementById("input").style.color = isLight ? '#000000' : '#ffffff';
            }

            if (author !== name) {
                textForm.remove();
                colorPicker.remove();
            } else {
                container.remove();
                colorPicker.addEventListener("change", () => {
                    const newText = textForm.querySelector('textarea[name="text"]').value;
                    const selectedColor = colorPicker.value;
                    updateData(newText, selectedColor);
                });

                textForm.addEventListener("input", async (e) => {
                    const newText = textForm.querySelector('textarea[name="text"]').value;
                    const selectedColor = colorPicker.value;
                    await updateData(newText, selectedColor);
                });
            }

            function luminance(hex) {
                const r = parseInt(hex.substring(1, 3), 16) / 255;
                const g = parseInt(hex.substring(3, 5), 16) / 255;
                const b = parseInt(hex.substring(5, 7), 16) / 255;
                return 0.299 * r + 0.587 * g + 0.114 * b;
            }

            async function fetchImageData() {
                try {
                    const response = await fetch("http://192.168.0.117:7000/ask_txt", {
                        method: "POST",
                        body: JSON.stringify({
                            id,
                        }),
                        headers: {
                            "Content-Type": "application/json",
                        },
                    });
                    const data = await response.json();
                    addImageToContainer(data);
                } catch (error) {
                    console.error("Error fetching data from the server:", error);
                }
            }

            fetchImageData();
        });
    </script>
</body>
</html>
